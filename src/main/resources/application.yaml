spring:
  application:
    name: monerium-api

  profiles:
    default: dev

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monerium_dca}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.jbqneto.moneriumdca: INFO

app:
  monerium:
    environment: ${MONERIUM_ENVIRONMENT:sandbox}
    base-url: ${MONERIUM_BASE_URL:https://api.monerium.dev}
    web-url: ${MONERIUM_WEB_URL:https://sandbox.monerium.dev}
    authorization-client-id: ${MONERIUM_AUTHORIZATION_CLIENT_ID:${MONERIUM_CLIENT_ID:}}
    client-credentials-client-id: ${MONERIUM_CLIENT_CREDENTIALS_CLIENT_ID:${MONERIUM_CLIENT_ID:}}
    client-secret: ${MONERIUM_CLIENT_SECRET:}
    webhook-secret: ${MONERIUM_WEBHOOK_SECRET:}
    redirect-uri: ${MONERIUM_REDIRECT_URI:http://localhost:8080/api/monerium/oauth/callback}
    default-chain: ${MONERIUM_DEFAULT_CHAIN:base}
    default-wallet-address: ${MONERIUM_DEFAULT_WALLET_ADDRESS:}
    api-version-accept-header: application/vnd.monerium.api-v2+json
    connect-timeout-seconds: ${MONERIUM_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${MONERIUM_READ_TIMEOUT_SECONDS:30}

  executor:
    base-url: ${EXECUTOR_BASE_URL:http://localhost:3001}
    api-key: ${EXECUTOR_API_KEY:local-dev-key}
    connect-timeout-seconds: ${EXECUTOR_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${EXECUTOR_READ_TIMEOUT_SECONDS:60}

  dca:
    single-tranche-limit: ${DCA_SINGLE_TRANCHE_LIMIT:150}
    double-tranche-limit: ${DCA_DOUBLE_TRANCHE_LIMIT:500}
    minimum-asset-execution-amount: ${DCA_MINIMUM_ASSET_EXECUTION_AMOUNT:10}
    allocations:
      btc: ${DCA_ALLOCATION_BTC:60}
      eth: ${DCA_ALLOCATION_ETH:25}
      sol: ${DCA_ALLOCATION_SOL:10}
      bnb: ${DCA_ALLOCATION_BNB:5}
